<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:825px;height:635px;background:#FFFFFF;" width="825px" height="635px" viewBox="0 0 825 635" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="263.428" y="30.78" fill="#000" font-size="14" textLength="297.104" font-weight="700" font-family="Helvetica">M8 — learning loop (PLANNED, not built yet)</text></g><ellipse cx="403.127" cy="60" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="274.398" y="90" width="257.457" height="44" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="284.398" y="109.24" fill="#000" font-size="12" textLength="237.457" font-family="Helvetica">every Decision stores the shown suggestion,</text><text x="284.398" y="121.24" fill="#000" font-size="12" textLength="210.41" font-family="Helvetica">its confidence, tier and the user's action</text><rect x="16" y="154" width="789.959" height="6" fill="#555" style="stroke:#555;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="28" y="170" width="220.732" height="313" fill="none" style="stroke:#000;stroke-width:1.5;" rx="4" ry="4"/><path d="M95.363,170 L95.363,175 L85.363,185 L28,185" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="31" y="180.24" fill="#000" font-size="12" textLength="57.363" font-family="Helvetica">Calibration</text><rect x="52.991" y="202" width="170.75" height="44" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="62.991" y="221.24" fill="#000" font-size="12" textLength="143.326" font-family="Helvetica">after ≥ 200 decisions: pairs</text><text x="62.991" y="233.24" fill="#000" font-size="12" textLength="150.75" font-family="Helvetica">(raw confidence, accepted?)</text><rect x="38" y="281" width="200.732" height="44" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="48" y="300.24" fill="#000" font-size="12" textLength="112.717" font-family="Helvetica">fit isotonic regression</text><text x="48" y="312.24" fill="#000" font-size="12" textLength="180.732" font-family="Helvetica">(monotone map raw → P(accept))</text><rect x="64.329" y="360" width="148.074" height="32" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="74.329" y="379.24" fill="#000" font-size="12" textLength="128.074" font-family="Helvetica">refit on demand / nightly</text><rect x="46.657" y="427" width="183.418" height="44" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="56.657" y="446.24" fill="#000" font-size="12" textLength="163.418" font-family="Helvetica">tiers and watch auto-move use</text><text x="56.657" y="458.24" fill="#000" font-size="12" textLength="113.408" font-family="Helvetica">calibrated confidence</text><rect x="258.732" y="203.5" width="257.418" height="254" fill="none" style="stroke:#000;stroke-width:1.5;" rx="4" ry="4"/><path d="M395.453,203.5 L395.453,208.5 L385.453,218.5 L258.732,218.5" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="261.732" y="213.74" fill="#000" font-size="12" textLength="126.721" font-family="Helvetica">Decision-driven weights</text><rect x="268.732" y="235.5" width="237.418" height="44" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="278.732" y="254.74" fill="#000" font-size="12" textLength="194.449" font-family="Helvetica">features per decision = signal values</text><text x="278.732" y="266.74" fill="#000" font-size="12" textLength="217.418" font-family="Helvetica">(centroid, profile, kNN, meta, LLM agree)</text><rect x="283.059" y="314.5" width="208.766" height="44" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="293.059" y="333.74" fill="#000" font-size="12" textLength="184.072" font-family="Helvetica">fit weights (e.g. logistic regression)</text><text x="293.059" y="345.74" fill="#000" font-size="12" textLength="188.766" font-family="Helvetica">from chosen vs rejected candidates</text><rect x="271.729" y="393.5" width="231.424" height="44" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="281.729" y="412.74" fill="#000" font-size="12" textLength="197.455" font-family="Helvetica">replace config weights when held-out</text><text x="281.729" y="424.74" fill="#000" font-size="12" textLength="211.424" font-family="Helvetica">accuracy improves; keep config as prior</text><rect x="541.855" y="197.5" width="252.104" height="266" fill="none" style="stroke:#000;stroke-width:1.5;" rx="4" ry="4"/><path d="M582.535,197.5 L582.535,202.5 L572.535,212.5 L541.855,212.5" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="544.855" y="207.74" fill="#000" font-size="12" textLength="30.68" font-family="Helvetica">Rules</text><rect x="551.855" y="229.5" width="232.104" height="56" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="561.855" y="248.74" fill="#000" font-size="12" textLength="133.4" font-family="Helvetica">mine consistent patterns:</text><text x="561.855" y="260.74" fill="#000" font-size="12" textLength="130.066" font-family="Helvetica">filename token → folder,</text><text x="561.855" y="272.74" fill="#000" font-size="12" textLength="212.104" font-family="Helvetica">download source (paypal.com) → folder</text><rect x="606.878" y="320.5" width="122.059" height="44" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="616.878" y="339.74" fill="#000" font-size="12" textLength="102.059" font-family="Helvetica">suggest a rule card</text><text x="616.878" y="351.74" fill="#000" font-size="12" textLength="89.883" font-family="Helvetica">"always X → Y?"</text><rect x="565.203" y="399.5" width="205.408" height="44" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="575.203" y="418.74" fill="#000" font-size="12" textLength="185.408" font-family="Helvetica">accepted rules short-circuit scoring</text><text x="575.203" y="430.74" fill="#000" font-size="12" textLength="161.098" font-family="Helvetica">(confidence = rule confidence)</text><rect x="16" y="503" width="789.959" height="6" fill="#555" style="stroke:#555;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="307.073" y="529" width="192.107" height="44" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="317.073" y="548.24" fill="#000" font-size="12" textLength="172.107" font-family="Helvetica">acceptance: after 200 decisions,</text><text x="317.073" y="560.24" fill="#000" font-size="12" textLength="165.979" font-family="Helvetica">Confirm-tier accept rate ≥ 95 %</text><ellipse cx="403.127" cy="604" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="403.127" cy="604" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="403.127" y1="70" x2="403.127" y2="90" style="stroke:#44546A;stroke-width:1;"/><polygon points="399.127,80,403.127,90,407.127,80,403.127,84" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="138.366" y1="246" x2="138.366" y2="281" style="stroke:#44546A;stroke-width:1;"/><polygon points="134.366,271,138.366,281,142.366,271,138.366,275" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="138.366" y1="325" x2="138.366" y2="360" style="stroke:#44546A;stroke-width:1;"/><polygon points="134.366,350,138.366,360,142.366,350,138.366,354" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="138.366" y1="392" x2="138.366" y2="427" style="stroke:#44546A;stroke-width:1;"/><polygon points="134.366,417,138.366,427,142.366,417,138.366,421" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><l