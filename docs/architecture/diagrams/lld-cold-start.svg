<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:460px;height:1139px;background:#FFFFFF;" width="460px" height="1139px" viewBox="0 0 460 1139" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="24.296" y="30.78" fill="#000" font-size="14" textLength="409.965" font-weight="700" font-family="Helvetica">Cold start — empty output tree → "Proposed structure" (LLD)</text></g><ellipse cx="247.453" cy="60" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="126.7,90,368.206,90,380.206,102,368.206,114,126.7,114,114.7,102,126.7,90" fill="#FFF" style="stroke:#2F5597;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="126.7" y="99.24" fill="#000" font-size="12" textLength="241.506" font-family="Helvetica">output has no indexed files and no subfolders</text><text x="126.7" y="111.24" fill="#000" font-size="12" textLength="191.443" font-family="Helvetica">and session is not a watch session?</text><text x="97.583" y="99.47" fill="#44546A" font-size="11" textLength="17.118" font-family="Helvetica">yes</text><text x="380.206" y="99.47" fill="#44546A" font-size="11" textLength="12.235" font-family="Helvetica">no</text><rect x="16" y="124" width="177.4" height="56" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="26" y="143.24" fill="#000" font-size="12" textLength="56.367" font-family="Helvetica">cold = true</text><text x="26" y="155.24" fill="#000" font-size="12" textLength="157.4" font-family="Helvetica">cards() shows only duplicates</text><text x="26" y="167.24" fill="#000" font-size="12" textLength="131.396" font-family="Helvetica">until the taxonomy exists</text><rect x="339.855" y="124" width="100.701" height="32" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="349.855" y="143.24" fill="#000" font-size="12" textLength="80.701" font-family="Helvetica">normal session</text><ellipse cx="390.206" cy="202" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="390.206" cy="202" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="151.074" y="233" width="192.758" height="32" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="161.074" y="252.24" fill="#000" font-size="12" textLength="172.758" font-family="Helvetica">embed every input file (phase B)</text><rect x="129.083" y="275" width="236.74" height="280" fill="none" style="stroke:#000;stroke-width:1.5;" rx="4" ry="4"/><path d="M339.872,275 L339.872,280 L329.872,290 L129.083,290" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="132.083" y="285.24" fill="#000" font-size="12" textLength="200.789" font-family="Helvetica">engine/proposer.cold_start_taxonomy</text><rect x="139.083" y="307" width="216.74" height="44" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="149.083" y="326.24" fill="#000" font-size="12" textLength="196.74" font-family="Helvetica">HDBSCAN on L2-normalised vectors</text><text x="149.083" y="338.24" fill="#000" font-size="12" textLength="190.002" font-family="Helvetica">(euclidean ≈ cosine) → leaf clusters</text><rect x="155.117" y="371" width="184.672" height="44" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="165.117" y="390.24" fill="#000" font-size="12" textLength="161.432" font-family="Helvetica">noise points join nearest leaf if</text><text x="165.117" y="402.24" fill="#000" font-size="12" textLength="164.672" font-family="Helvetica">cos ≥ threshold, else → _Inbox</text><rect x="150.081" y="435" width="194.744" height="44" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="160.081" y="454.24" fill="#000" font-size="12" textLength="174.744" font-family="Helvetica">merge over-split leaves while the</text><text x="160.081" y="466.24" fill="#000" font-size="12" textLength="156.75" font-family="Helvetica">merged group stays cohesive</text><rect x="149.064" y="499" width="196.777" height="44" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="159.064" y="518.24" fill="#000" font-size="12" textLength="176.777" font-family="Helvetica">average-linkage on leaf centroids</text><text x="159.064" y="530.24" fill="#000" font-size="12" textLength="155.344" font-family="Helvetica">→ 5-12 top folders, depth ≤ 2</text><rect x="100.226" y="565" width="294.455" height="216" fill="none" style="stroke:#000;stroke-width:1.5;" rx="4" ry="4"/><path d="M188.952,565 L188.952,570 L178.952,580 L100.226,580" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="103.226" y="575.24" fill="#000" font-size="12" textLength="78.727" font-family="Helvetica">engine/naming</text><rect x="110.226" y="597" width="274.455" height="56" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="120.226" y="616.24" fill="#000" font-size="12" textLength="214.055" font-family="Helvetica">fallback names now: c-TF-IDF keywords</text><text x="120.226" y="628.24" fill="#000" font-size="12" textLength="254.455" font-family="Helvetica">+ kind hints (EXIF → Photos, bundles → Code),</text><text x="120.226" y="640.24" fill="#000" font-size="12" textLength="231.439" font-family="Helvetica">generic names rejected, Windows-sanitised</text><rect x="144.913" y="673" width="205.08" height="32" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="154.913" y="692.24" fill="#000" font-size="12" textLength="185.08" font-family="Helvetica">Proposal(kind = taxonomy) → card</text><rect x="129.723" y="725" width="235.461" height="44" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="139.723" y="744.24" fill="#000" font-size="12" textLength="152.086" font-family="Helvetica">LLM renames in background</text><text x="139.723" y="756.24" fill="#000" font-size="12" textLength="215.461" font-family="Helvetica">(one call per top folder) → card_updated</text><rect x="130.733" y="801" width="233.439" height="32" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="140.733" y="820.24" fill="#000" font-size="12" textLength="213.439" font-family="Helvetica">user accepts all / a subset / edits names</text><rect x="120.061" y="853" width="254.785" height="44" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="130.061" y="872.24" fill="#000" font-size="12" textLength="234.785" font-family="Helvetica">executor mkdir per folder — one decision_id</text><text x="130.061" y="884.24" fill="#000" font-size="12" textLength="91.4" font-family="Helvetica">→ one undo step</text><rect x="113.703" y="917" width="267.5" height="44" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="123.703" y="936.24" fill="#000" font-size="12" textLength="247.5" font-family="Helvetica">on_folders_created: each folder profile seeded</text><text x="123.703" y="948.24" fill="#000" font-size="12" textLength="187.406" font-family="Helvetica">with its cluster centroid (weight 0.8)</text><rect x="123.078" y="981" width="248.75" height="44" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="133.078" y="1000.24" fill="#000" font-size="12" textLength="228.75" font-family="Helvetica">rescore_stale (sync) → files now score into</text><text x="133.078" y="1012.24" fill="#000" font-size="12" textLength="195" font-family="Helvetica">their cluster's folder (Confirm mostly)</text><rect x="197.437" y="1045" width="100.033" height="32" fill="#EAF1FB" style="stroke:#2F5597;stroke-width:0.5;" rx="4" ry="4"/><text x="207.437" y="1064.24" fill="#000" font-size="12" textLength="80.033" font-family="Helvetica">normal swiping</text><ellipse cx="247.453" cy="1108" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="247.453" cy="1108" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="390.206" y1="156" x2="390.206" y2="191" style="stroke:#44546A;stroke-width:1;"/><polygon points="386.206,181,390.206,191,394.206,181,390.206,185" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="114.7" y1="102" x2="104.7" y2="102" style="stroke:#44546A;stroke-width:1;"/><line x1="104.7" y1="102" x2="104.7" y2="124" style="stroke:#44546A;stroke-width:1;"/><polygon points="100.7,114,104.7,124,108.7,114,104.7,118" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="380.206" y1="102" x2="390.206" y2="102" style="stroke:#44546A;stroke-width:1;"/><line x1="390.206" y1="102" x2="390.206" y2="124" style="stroke:#44546A;stroke-width:1;"/><polygon points="386.206,114,390.206,124,394.206,114,390.206,118" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="104.7" y1="180" x2="104.7" y2="218" style="stroke:#44546A;stroke-width:1;"/><line x1="104.7" y1="218" x2="247.453" y2="218" style="stroke:#44546A;stroke-width:1;"/><line x1="247.453" y1="218" x2="247.453" y2="233" style="stroke:#44546A;stroke-width:1;"/><polygon points="243.453,223,247.453,233,251.453,223,247.453,227" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="247.453" y1="70" x2="247.453" y2="90" style="stroke:#44546A;stroke-width:1;"/><polygon points="243.453,80,247.453,90,251.453,80,247.453,84" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="247.453" y1="351" x2="247.453" y2="371" style="stroke:#44546A;stroke-width:1;"/><polygon points="243.453,361,247.453,371,251.453,361,247.453,365" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="2