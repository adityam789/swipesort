2" style="stroke:#44546A;stroke-width:1;"/><text x="52.341" y="137.47" fill="#44546A" font-size="11" textLength="53.206" font-family="Helvetica">Pair phone</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg2" data-source-line="10"><polygon points="365.021,163,375.021,167,365.021,171,369.021,167" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="127.359" y1="167" x2="371.021" y2="167" style="stroke:#44546A;stroke-width:1;"/><text x="134.359" y="162.47" fill="#44546A" font-size="11" textLength="174.238" font-family="Helvetica">POST /api/pair/start (loopback only)</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg3" data-source-line="11"><line x1="377.021" y1="214" x2="419.021" y2="214" style="stroke:#44546A;stroke-width:1;"/><line x1="419.021" y1="214" x2="419.021" y2="227" style="stroke:#44546A;stroke-width:1;"/><line x1="378.021" y1="227" x2="419.021" y2="227" style="stroke:#44546A;stroke-width:1;"/><polygon points="388.021,223,378.021,227,388.021,231,384.021,227" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="384.021" y="187.47" fill="#44546A" font-size="11" textLength="136.028" font-family="Helvetica">code = 8 chars from secrets</text><text x="384.021" y="198.47" fill="#44546A" font-size="11" textLength="123.514" font-family="Helvetica">(alphabet without 0/O/1/I)</text><text x="384.021" y="209.47" fill="#44546A" font-size="11" textLength="160.188" font-family="Helvetica">store sha256(code), expiry 5 min</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg4" data-source-line="12"><polygon points="138.359,248,128.359,252,138.359,256,134.359,252" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="132.359" y1="252" x2="376.021" y2="252" style="stroke:#44546A;stroke-width:1;stroke-dasharray:2,2;"/><text x="144.359" y="247.47" fill="#44546A" font-size="11" textLength="225.661" font-family="Helvetica">{code, url = http://&lt;lan-ip>:8765/pair?code=…}</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg5" data-source-line="13"><polygon points="56.341,273,46.341,277,56.341,281,52.341,277" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="50.341" y1="277" x2="126.359" y2="277" style="stroke:#44546A;stroke-width:1;"/><text x="62.341" y="272.47" fill="#44546A" font-size="11" textLength="44.011" font-family="Helvetica">QR of url</text></g><g class="message" data-entity-1="part4" data-entity-2="part3" id="msg6" data-source-line="14"><polygon points="388.021,298,378.021,302,388.021,306,384.021,302" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="382.021" y1="302" x2="643.648" y2="302" style="stroke:#44546A;stroke-width:1;"/><text x="394.021" y="297.47" fill="#44546A" font-size="11" textLength="241.205" font-family="Helvetica">GET /pair?code=… (static PWA, no auth needed)</text></g><g class="message" data-entity-1="part4" data-entity-2="part3" id="msg7" data-source-line="15"><polygon points="388.021,323,378.021,327,388.021,331,384.021,327" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="382.021" y1="327" x2="643.648" y2="327" style="stroke:#44546A;stroke-width:1;"/><text x="394.021" y="322.47" fill="#44546A" font-size="11" textLength="106.396" font-family="Helvetica">POST /api/pair {code}</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg8" data-source-line="16"><line x1="377.021" y1="363" x2="419.021" y2="363" style="stroke:#44546A;stroke-width:1;"/><line x1="419.021" y1="363" x2="419.021" y2="376" style="stroke:#44546A;stroke-width:1;"/><line x1="378.021" y1="376" x2="419.021" y2="376" style="stroke:#44546A;stroke-width:1;"/><polygon points="388.021,372,378.021,376,388.021,380,384.021,376" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="384.021" y="347.47" fill="#44546A" font-size="11" textLength="163.254" font-family="Helvetica">constant-time compare of sha256</text><text x="384.021" y="358.47" fill="#44546A" font-size="11" textLength="158.968" font-family="Helvetica">single use · 5 fails / 5 min → 429</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg9" data-source-line="17"><line x1="377.021" y1="412" x2="419.021" y2="412" style="stroke:#44546A;stroke-width:1;"/><line x1="419.021" y1="412" x2="419.021" y2="425" style="stroke:#44546A;stroke-width:1;"/><line x1="378.021" y1="425" x2="419.021" y2="425" style="stroke:#44546A;stroke-width:1;"/><polygon points="388.021,421,378.021,425,388.021,429,384.021,425" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="384.021" y="396.47" fill="#44546A" font-size="11" textLength="113.432" font-family="Helvetica">token = 256-bit random</text><text x="384.021" y="407.47" fill="#44546A" font-size="11" textLength="146.131" font-family="Helvetica">store sha256(token) in Device</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg10" data-source-line="18"><polygon points="632.648,446,642.648,450,632.648,454,636.648,450" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="377.021" y1="450" x2="638.648" y2="450" style="stroke:#44546A;stroke-width:1;stroke-dasharray:2,2;"/><text x="384.021" y="445.47" fill="#44546A" font-size="11" textLength="243.627" font-family="Helvetica">Set-Cookie (HttpOnly, SameSite=Strict, 180 days)</text></g><g class="message" data-entity-1="part4" data-entity-2="part3" id="msg11" data-source-line="19"><polygon points="388.021,471,378.021,475,388.021,479,384.021,475" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="382.021" y1="475" x2="643.648" y2="475" style="stroke:#44546A;stroke-width:1;"/><text x="394.021" y="470.47" fill="#44546A" font-size="11" textLength="124.728" font-family="Helvetica">/api/* and WS with cookie</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg12" data-source-line="20"><line x1="377.021" y1="511" x2="419.021" y2="511" style="stroke:#44546A;stroke-width:1;"/><line x1="419.021" y1="511" x2="419.021" y2="524" style="stroke:#44546A;stroke-width:1;"/><line x1="378.021" y1="524" x2="419.021" y2="524" style="stroke:#44546A;stroke-width:1;"/><polygon points="388.021,520,378.021,524,388.021,528,384.021,524" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="384.021" y="495.47" fill="#44546A" font-size="11" textLength="157.131" font-family="Helvetica">middleware: loopback → trusted</text><text x="384.021" y="506.47" fill="#44546A" font-size="11" textLength="177.939" font-family="Helvetica">else valid token → allowed, else 401</text></g><path d="M382.021,541 L382.021,587 A4,4 0 0 0 386.021,591 L644.021,591 A4,4 0 0 0 648.021,587 L648.021,547 L638.021,537 L386.021,537 A4,4 0 0 0 382.021,541" style="stroke:#A5A5A5;stroke-width:0.5;" fill="#FFFDF2"/><path d="M638.021,537 L638.021,545 A2,2 0 0 0 640.021,547 L648.021,547 L638.021,537" style="stroke:#A5A5A5;stroke-width:0.5;" fill="#FFFDF2"/><text x="388.021" y="550.47" fill="#000" font-size="11" textLength="187.102" font-family="Helvetica">Desktop only, even with a token (403):</text><text x="388.021" y="561.47" fill="#000" font-size="11" textLength="242.091" font-family="Helvetica">pair/start, QR, devices, create session, fs browse.</text><text x="388.021" y="572.47" fill="#000" font-size="11" textLength="245.18" font-family="Helvetica">Loopback requests must carry a local Host header</text><text x="388.021" y="583.47" fill="#000" font-size="11" textLength="113.717" font-family="Helvetica">