lvetica">across volumes)</text></g><g class="entity" data-qualified-name="U" id="ent0003" data-source-line="6"><rect x="269.02" y="459" width="134.721" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><line x1="269.02" y1="481" x2="403.741" y2="481" style="stroke:#181818;stroke-width:0.5;"/><text x="316.359" y="473.24" fill="#000" font-size="12" textLength="40.043" font-family="Helvetica">undone</text><text x="274.02" y="495.24" fill="#000" font-size="12" textLength="114.721" font-family="Helvetica">reverse op performed</text></g><g class="entity" data-qualified-name="F" id="ent0004" data-source-line="7"><rect x="299.02" y="291" width="158.727" height="56" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><line x1="299.02" y1="313" x2="457.747" y2="313" style="stroke:#181818;stroke-width:0.5;"/><text x="364.04" y="305.24" fill="#000" font-size="12" textLength="28.688" font-family="Helvetica">failed</text><text x="304.02" y="327.24" fill="#000" font-size="12" textLength="138.727" font-family="Helvetica">locked file: retry, then skip</text><text x="304.02" y="339.24" fill="#000" font-size="12" textLength="74.695" font-family="Helvetica">(never forced)</text></g><g class="start_entity" data-qualified-name=".start." id="ent0005" data-source-line="9"><ellipse cx="308.38" cy="51" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0010" data-source-line="13"><ellipse cx="450.38" cy="581" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="450.38" cy="581" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="17"><path d="M563.02,301.5 L563.02,336.5 A4,4 0 0 0 567.02,340.5 L815.73,340.5 A4,4 0 0 0 819.73,336.5 L819.73,307.5 L809.73,297.5 L567.02,297.5 A4,4 0 0 0 563.02,301.5" style="stroke:#A5A5A5;stroke-width:0.5;" fill="#FFFDF2"/>