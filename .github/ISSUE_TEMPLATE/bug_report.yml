name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. swipesort serve
        2. ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Windows, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SwipeSort version / commit
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Daemon output or ~/.swipesort/logs. Remove any personal file names first.
      render: text
