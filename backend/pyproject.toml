[project]
name = "swipesort"
version = "0.1.0"
description = "Local-first AI-assisted file sorter"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sqlmodel>=0.0.22",
  "blake3>=0.4",
  "xxhash>=3.4",
  "send2trash>=1.8",
  "typer>=0.12",
  "numpy>=2.5.5",
  "httpx>=0.28.1",
  "pypdfium2>=5.15.2",
  "python-docx>=1.2.0",
  "python-pptx>=1.0.2",
  "openpyxl>=3.1.5",
  "pillow>=13.0.0",
  "pillow-heif>=1.8.1",
  "exifread>=3.5.1",
  "mutagen>=1.48.1",
  "fastembed>=0.9.1",
  "imagehash>=4.3.2",
  "datasketch>=2.0.0",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
macos = ["pyobjc-framework-CoreServices>=10; sys_platform == 'darwin'"]
windows = ["pywin32>=306; sys_platform == 'win32'"]
llm-inprocess = ["llama-cpp-python>=0.3"]

[project.scripts]
swipesort = "swipesort.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "hypothesis>=6.100", "httpx>=0.27", "mypy>=1.11", "ruff>=0.6", "pillow>=10", "reportlab>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swipesort"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["send2trash.*", "xxhash.*", "blake3.*", "reportlab.*", "fastembed.*", "sklearn.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
