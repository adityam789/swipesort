[project]
name = "swipesort"
version = "0.1.0"
description = "Local-first AI-assisted file sorter"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sqlmodel>=0.0.22",
  "blake3>=0.4",
  "xxhash>=3.4",
  "send2trash>=1.8",
  "typer>=0.12",
]

[project.optional-dependencies]
macos = ["pyobjc-framework-CoreServices>=10; sys_platform == 'darwin'"]
windows = ["pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
swipesort = "swipesort.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "hypothesis>=6.100", "httpx>=0.27", "mypy>=1.11", "ruff>=0.6", "pillow>=10", "reportlab>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swipesort"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["send2trash.*", "xxhash.*", "blake3.*", "reportlab.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
